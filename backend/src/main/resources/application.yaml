server:

  port: 8080



spring:

  application:

    name: aeroquell-api


  datasource:

    url: jdbc:postgresql://localhost:5432/aeroquell_db

    username: postgres

    password: math



  jpa:

    hibernate:

      ddl-auto: update


    show-sql: true


    properties:

      hibernate:

        format_sql: true

flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: YOUR_256_BIT_SECRET_KEY_HERE
  expiration: 86400000


management:

  endpoints:

    web:

      exposure:

        include: health,info